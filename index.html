<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sycophancy Annotator</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c1f24; --muted: #6b7280; --line: #e3e6ea;
    --accent: #2f6fed; --accent-ink: #ffffff; --ok: #1f9d55; --warn: #d97706; --chip: #eef2ff; --chip-ink: #3b4fa0;
    --danger: #c0392b; --focus: #bcd0ff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1d2026; --ink: #e8eaee; --muted: #9aa3ad; --line: #2c3037;
      --accent: #6b95ff; --accent-ink: #0f172a; --ok: #3fbf7f; --warn: #f0a13a; --chip: #262c45; --chip-ink: #b7c3ff;
      --danger: #ef6b5e; --focus: #34518f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; }
  .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress b { color: var(--ink); }
  .spacer { flex: 1; }
  button, label.btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; line-height: 1.2;
  }
  button:hover, label.btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=file] { display: none; }
  main { display: grid; grid-template-columns: 320px 1fr; flex: 1; min-height: 0; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .side-tools { padding: 10px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .side-tools input[type=search] {
    flex: 1; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit;
  }
  .side-tools select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  #list { overflow-y: auto; flex: 1; }
  .row {
    display: grid; grid-template-columns: 44px 1fr 10px; gap: 8px; align-items: center;
    padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .row:hover { background: var(--bg); }
  .row.active { background: var(--chip); }
  .row .idx { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .snip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.partial { background: var(--warn); }
  .dot.done { background: var(--ok); }
  .dot.removed { background: var(--danger); }
  .row.removed .snip { text-decoration: line-through; opacity: .55; }
  section { overflow-y: auto; padding: 20px 28px; }
  .item-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .item-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .chip { display: inline-block; background: var(--chip); color: var(--chip-ink); padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .status { color: var(--muted); font-size: 12px; }
  .status.done { color: var(--ok); } .status.partial { color: var(--warn); } .status.removed { color: var(--danger); }
  .banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: color-mix(in srgb, var(--danger) 12%, var(--panel)); border: 1px solid var(--danger); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  .banner b { color: var(--danger); }
  section.removed textarea { opacity: .55; }
  .input-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; white-space: pre-wrap; word-break: break-word; margin-bottom: 18px;
  }
  .input-box .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .field { margin-bottom: 14px; }
  .field .lbl { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .field .lbl code { font-size: 13px; font-weight: 600; background: var(--chip); color: var(--chip-ink); padding: 1px 6px; border-radius: 4px; }
  .field .hint { color: var(--muted); font-size: 12px; }
  .field .hint b { color: var(--ink); font-weight: 600; }
  textarea[data-f="y-"] { min-height: 200px; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit;
  }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .nav { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .nav .jump { display: flex; align-items: center; gap: 6px; color: var(--muted); margin-left: auto; }
  .nav input[type=number] { width: 72px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; }
  kbd { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--muted); }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    aside { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Sycophancy Annotator</h1>
  <span class="progress"><b id="doneCount">0</b> / <span id="total">0</span> complete · <span id="partialCount">0</span> partial · <span id="removedCount">0</span> removed</span>
  <span class="spacer"></span>
  <label class="btn" title="Load a previously downloaded JSONL to resume; matches rows by user_input">Import JSONL<input type="file" id="importFile" accept=".jsonl,.json,.txt"></label>
  <button id="downloadBtn" class="primary" title="Download all rows with y+, y-, u2 added">Download JSONL</button>
  <button id="clearBtn" class="danger" title="Erase all annotations saved in this browser">Clear all</button>
</header>
<main>
  <aside>
    <div class="side-tools">
      <input type="search" id="filter" placeholder="Search inputs…">
      <select id="view" title="Which rows to list"><option value="all">all</option><option value="todo">unfinished</option><option value="removed">removed</option></select>
    </div>
    <div id="list"></div>
  </aside>
  <section id="editor"><div class="empty">Loading data…</div></section>
</main>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  const FIELDS = ['y+', 'y-', 'u2'];
  const HINTS = {
    'y+': 'preferred response',
    'y-': 'dispreferred response',
    'u2': 'follow-up user turn',
  };
  const STORE_KEY = 'sycophancy-annotations-v1';
  const DATA_URL = 'sycophancy.jsonl';

  let data = [];          // original rows, in file order
  let ann = {};           // index -> {y+, y-, u2}
  let removed = {};       // index -> true when excluded from the dataset
  const REMOVED_KEY = 'sycophancy-removed-v1';
  let cur = 0;
  let visible = [];       // indices currently shown in the list

  const $ = (id) => document.getElementById(id);
  const list = $('list'), editor = $('editor'), toast = $('toast');

  // ---------- persistence ----------
  function loadStore(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return {};
      const obj = JSON.parse(raw);
      return obj && typeof obj === 'object' ? obj : {};
    } catch (e) { return {}; }
  }
  let saveTimer = null;
  function saveStore() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(ann)); localStorage.setItem(REMOVED_KEY, JSON.stringify(removed)); }
      catch (e) { showToast('Could not save to browser storage: ' + e.message); }
    }, 150);
  }

  // ---------- helpers ----------
  function effVal(i, f) {
    const a = ann[i];
    if (a && Object.prototype.hasOwnProperty.call(a, f)) return a[f];
    const d = data[i] && data[i][f];
    return typeof d === 'string' ? d : '';
  }
  function setField(i, f, v) {
    if (!ann[i]) ann[i] = {};
    ann[i][f] = v;
    saveStore();
  }
  function statusOf(i) {
    if (removed[i]) return 'removed';
    const filled = FIELDS.filter((k) => effVal(i, k).trim()).length;
    return filled === FIELDS.length ? 'done' : filled > 0 ? 'partial' : 'todo';
  }
  function statusLabel(s) {
    return s === 'done' ? 'complete' : s === 'partial' ? 'partially filled' : s === 'removed' ? 'removed from dataset' : 'not started';
  }
  function toggleRemoved(i) {
    if (removed[i]) { delete removed[i]; saveStore(); renderList(); refreshRow(i); renderEditor(); showToast('Restored item ' + (i + 1)); return; }
    removed[i] = true; saveStore(); renderList(); refreshRow(i);
    showToast('Removed item ' + (i + 1) + ' from dataset');
    let n = i + 1; while (n < data.length && removed[n]) n++;
    if (n < data.length) go(n); else renderEditor();
  }
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(showToast.t); showToast.t = setTimeout(() => toast.classList.remove('show'), 2200);
  }
  function parseJsonl(text) {
    const rows = [];
    text.split(/\r?\n/).forEach((line, n) => {
      if (!line.trim()) return;
      try { rows.push(JSON.parse(line)); }
      catch (e) { throw new Error('Bad JSON on line ' + (n + 1)); }
    });
    return rows;
  }

  // ---------- rendering ----------
  function renderCounts() {
    let done = 0, partial = 0, rem = 0;
    for (let i = 0; i < data.length; i++) { const s = statusOf(i); if (s === 'done') done++; else if (s === 'partial') partial++; else if (s === 'removed') rem++; }
    $('doneCount').textContent = done; $('partialCount').textContent = partial; $('removedCount').textContent = rem; $('total').textContent = data.length - rem;
  }
  function renderList() {
    const q = $('filter').value.trim().toLowerCase();
    const view = $('view').value;
    visible = [];
    const frag = document.createDocumentFragment();
    data.forEach((row, i) => {
      const s = statusOf(i);
      if (view === 'todo' && (s === 'done' || s === 'removed')) return;
      if (view === 'removed' && s !== 'removed') return;
      if (q && !row.user_input.toLowerCase().includes(q)) return;
      visible.push(i);
      const div = document.createElement('div');
      div.className = 'row' + (i === cur ? ' active' : '') + (s === 'removed' ? ' removed' : '');
      div.dataset.i = i;
      div.innerHTML = '<span class="idx">' + (i + 1) + '</span><span class="snip"></span><span class="dot ' + s + '"></span>';
      div.querySelector('.snip').textContent = row.user_input;
      frag.appendChild(div);
    });
    list.innerHTML = '';
    list.appendChild(frag);
    const active = list.querySelector('.row.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }
  function refreshRow(i) {
    const s = statusOf(i);
    const el = list.querySelector('.row[data-i="' + i + '"]');
    if (el) { el.querySelector('.dot').className = 'dot ' + s; el.classList.toggle('removed', s === 'removed'); }
    const st = editor.querySelector('.status');
    if (st) { st.className = 'status ' + s; st.textContent = statusLabel(s); }
    renderCounts();
  }
  function renderEditor() {
    if (!data.length) { editor.innerHTML = '<div class="empty">No data loaded.</div>'; return; }
    const row = data[cur], s = statusOf(cur), isRem = s === 'removed';
    const chips = (row.measure || []).map((m) => '<span class="chip"></span>').join(' ');
    editor.innerHTML =
      '<div class="item-head"><h2>Item ' + (cur + 1) + ' of ' + data.length + '</h2>' + chips +
      '<span class="status ' + s + '">' + statusLabel(s) + '</span></div>' +
      (isRem ? '<div class="banner"><b>Removed from dataset.</b> This row is left out of the downloaded JSONL. <button id="restoreBtn">Restore</button></div>' : '') +
      '<div class="input-box"><div class="lbl">user_input</div><div class="txt"></div></div>' +
      FIELDS.map((f) =>
        '<div class="field"><div class="lbl"><code></code><span class="hint">' + HINTS[f] +
        (f === 'y-' && row['y-_model'] ? ' · original reply from <b class="src"></b>' : (f === 'y-' && !(row['y-'] || '').trim() ? ' · no violating reply found' : '')) + '</span></div>' +
        '<textarea data-f="' + f + '" spellcheck="true"></textarea></div>').join('') +
      '<div class="nav"><button id="prevBtn">← Prev</button><button id="nextBtn" class="primary">Next →</button>' +
      '<button id="removeBtn" class="danger" title="Exclude this row from the dataset (Ctrl+Delete)">' + (isRem ? 'Restore' : 'Remove from dataset') + '</button>' +
      '<span class="hint" style="color:var(--muted);margin-left:8px"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> next · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Enter</kbd> prev · <kbd>Ctrl</kbd>+<kbd>Del</kbd> remove</span>' +
      '<span class="jump">go to <input type="number" id="jump" min="1" max="' + data.length + '" value="' + (cur + 1) + '"></span></div>';
    editor.querySelectorAll('.chip').forEach((c, k) => c.textContent = row.measure[k]);
    editor.querySelector('.txt').textContent = row.user_input;
    editor.querySelectorAll('.field').forEach((fe, k) => {
      const f = FIELDS[k];
      fe.querySelector('code').textContent = f;
      const src = fe.querySelector('.src'); if (src) src.textContent = row['y-_model'];
      const ta = fe.querySelector('textarea');
      ta.value = effVal(cur, f);
      ta.disabled = isRem;
      ta.addEventListener('input', () => { setField(cur, f, ta.value); refreshRow(cur); });
    });
    editor.classList.toggle('removed', isRem);
    $('removeBtn').onclick = () => toggleRemoved(cur);
    const rb = $('restoreBtn'); if (rb) rb.onclick = () => toggleRemoved(cur);
    $('prevBtn').disabled = cur === 0;
    $('nextBtn').disabled = cur === data.length - 1;
    $('prevBtn').onclick = () => go(cur - 1);
    $('nextBtn').onclick = () => go(cur + 1);
    $('jump').addEventListener('change', (e) => { const n = parseInt(e.target.value, 10); if (n >= 1 && n <= data.length) go(n - 1); });
    editor.scrollTop = 0;
    const first = editor.querySelector('textarea'); if (first && !isRem) first.focus();
  }
  function go(i) {
    if (i < 0 || i >= data.length) return;
    cur = i;
    list.querySelectorAll('.row.active').forEach((r) => r.classList.remove('active'));
    const el = list.querySelector('.row[data-i="' + i + '"]');
    if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
    renderEditor();
  }

  // ---------- import / export ----------
  function download() {
    const lines = [];
    data.forEach((row, i) => {
      if (removed[i]) return;
      const out = Object.assign({}, row);
      FIELDS.forEach((f) => { out[f] = effVal(i, f); });
      lines.push(JSON.stringify(out));
    });
    const blob = new Blob([lines.join('\n') + '\n'], { type: 'application/x-ndjson' });
    const url = URL.createObjectURL(blob);
    const aEl = document.createElement('a');
    aEl.href = url; aEl.download = 'sycophancy_annotated.jsonl';
    document.body.appendChild(aEl); aEl.click(); aEl.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    const nRem = data.length - lines.length;
    showToast('Downloaded ' + lines.length + ' rows' + (nRem ? ' (' + nRem + ' removed)' : ''));
  }
  function importFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let rows;
      try { rows = parseJsonl(reader.result); } catch (e) { showToast(e.message); return; }
      const byInput = new Map();
      data.forEach((row, i) => byInput.set(row.user_input, i));
      let merged = 0, unmatched = 0;
      rows.forEach((r) => {
        const i = byInput.get(r.user_input);
        if (i === undefined) { unmatched++; return; }
        let touched = false;
        FIELDS.forEach((f) => { if (typeof r[f] === 'string' && r[f].trim()) { if (!ann[i]) ann[i] = {}; ann[i][f] = r[f]; touched = true; } });
        if (touched) merged++;
      });
      saveStore(); renderCounts(); renderList(); renderEditor();
      showToast('Imported annotations for ' + merged + ' rows' + (unmatched ? ' (' + unmatched + ' unmatched)' : ''));
    };
    reader.readAsText(file);
  }

  // ---------- events ----------
  $('downloadBtn').onclick = download;
  $('importFile').addEventListener('change', (e) => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; });
  $('clearBtn').onclick = () => {
    if (!confirm('Erase every annotation and removal stored in this browser? Download a copy first if you want to keep them.')) return;
    ann = {}; removed = {}; saveStore(); renderCounts(); renderList(); renderEditor(); showToast('Cleared');
  };
  $('filter').addEventListener('input', renderList);
  $('view').addEventListener('change', renderList);
  list.addEventListener('click', (e) => { const r = e.target.closest('.row'); if (r) go(parseInt(r.dataset.i, 10)); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); go(e.shiftKey ? cur - 1 : cur + 1); }
    if (e.key === 'Delete' && (e.ctrlKey || e.metaKey) && data.length) { e.preventDefault(); toggleRemoved(cur); }
  });
  window.addEventListener('beforeunload', () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(ann)); localStorage.setItem(REMOVED_KEY, JSON.stringify(removed)); } catch (e) {} });

  // ---------- boot ----------
  function start(rows) {
    data = rows.filter((r) => r && typeof r.user_input === 'string');
    ann = loadStore(STORE_KEY); removed = loadStore(REMOVED_KEY);
    Object.keys(ann).forEach((k) => { if (!(k in data)) delete ann[k]; });
    Object.keys(removed).forEach((k) => { if (!(k in data)) delete removed[k]; });
    cur = 0;
    for (let i = 0; i < data.length; i++) { const st = statusOf(i); if (st !== 'done' && st !== 'removed') { cur = i; break; } }
    renderCounts(); renderList(); renderEditor();
  }
  fetch(DATA_URL).then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then((t) => start(parseJsonl(t)))
    .catch(() => {
      editor.innerHTML = '<div class="empty">Could not load <code>sycophancy.jsonl</code> next to this page.<br><br>' +
        '<label class="btn">Choose data file<input type="file" id="dataFile" accept=".jsonl,.json,.txt"></label></div>';
      $('dataFile').addEventListener('change', (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => { try { start(parseJsonl(rd.result)); } catch (err) { showToast(err.message); } };
        rd.readAsText(f);
      });
    });
})();
</script>
</body>
</html>
